<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recebemos o seu caso — Helane Souza</title>
  <meta name="robots" content="noindex">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Montserrat:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">

  <!-- ============================================================
       META PIXEL
       Troque COLOQUE_SEU_PIXEL_ID_AQUI pelo numero do seu Pixel
       (Gerenciador de Eventos -> conjunto de dados -> numero no topo)
       ============================================================ -->
  <script>
    var META_PIXEL_ID = '1154028900530479';

    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
    n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
    document,'script','https://connect.facebook.net/en_US/fbevents.js');

    if (META_PIXEL_ID && META_PIXEL_ID.indexOf('COLOQUE') === -1) {
      fbq('init', META_PIXEL_ID);
      fbq('track', 'PageView');

      // ---- Evento Lead: dispara 1 vez por envio real ----
      // Se a URL trouxer ?eid=... (id unico gerado pelo formulario),
      // usamos ele para deduplicar com o servidor no futuro.
      (function () {
        var eid = null;
        try { eid = new URLSearchParams(window.location.search).get('eid'); } catch (e) {}

        if (eid) {
          // Um Lead por eid: recarregar a pagina nao dispara de novo.
          var chave = 'helane_lead_' + eid;
          var jaEnviado = false;
          try { jaEnviado = !!localStorage.getItem(chave); } catch (e) {}
          if (!jaEnviado) {
            fbq('track', 'Lead', {}, { eventID: eid });
            try { localStorage.setItem(chave, '1'); } catch (e) {}
          }
        } else {
          // Sem eid (visita direta): gera um id e protege contra recarregar
          // usando a memoria da aba (sessionStorage).
          var jaNaSessao = false;
          try { jaNaSessao = !!sessionStorage.getItem('helane_lead_sessao'); } catch (e) {}
          if (!jaNaSessao) {
            var novoId = (window.crypto && crypto.randomUUID)
              ? crypto.randomUUID()
              : 'lead-' + Date.now() + '-' + Math.random().toString(36).slice(2);
            fbq('track', 'Lead', {}, { eventID: novoId });
            try { sessionStorage.setItem('helane_lead_sessao', novoId); } catch (e) {}
          }
        }
      })();
    }
  </script>
  <noscript><img height="1" width="1" style="display:none" alt=""
    src="https://www.facebook.com/tr?id=1154028900530479&ev=PageView&noscript=1"></noscript>
